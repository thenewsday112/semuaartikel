name: Auto Run Python Scripts

on:
  schedule:
    # Berjalan otomatis setiap 1 jam sekali (Cron Syntax)
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan workflow secara manual dari menu Actions

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repositori Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python versi 3.11 (versi stabil bebas warning)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Mempercepat eksekusi dengan caching dependency

      # 3. Install dependency jika file requirements.txt tersedia
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Jalankan skrip import.py
      - name: Run import.py
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python import.py

      # 5. Jalankan skrip export.py
      - name: Run export.py
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python export.py

      # 6. Commit & Push otomatis jika ada file baru/perubahan dari hasil eksekusi skrip
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update via GitHub Actions" && git push)
